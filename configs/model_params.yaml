# SolarCast Model Hyperparameter and Search Space Configuration (Task M1.4)
schema_version: "1.0.0"
feature_set: "A"
random_seed: 42
n_search_iter: 10
clip_bounds_kwh: [0.0, 893.0]
night_zero: true

training_filters:
  quality_flags: ["VALID"]
  exclude_suspect_zero: true
  daylight_only: true

models:
  ridge:
    search_space:
      alpha: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
      fit_intercept: [true]
    preprocessing:
      imputer: "median"
      scaler: "standard"

  hist_gradient_boosting:
    search_space:
      learning_rate: [0.01, 0.03, 0.05, 0.1, 0.15, 0.2]
      max_iter: [50, 100, 150, 200]
      max_leaf_nodes: [15, 31, 63]
      min_samples_leaf: [10, 20, 50, 100]
      l2_regularization: [0.0, 0.1, 1.0, 10.0]
    preprocessing:
      imputer: "none"
      scaler: "none"
